<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fractale de Mandelbrot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #0d1117;
            color: #e6edf3;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }
        h1 {
            font-size: 1.4rem;
            margin-bottom: 12px;
            font-weight: 600;
        }
        #container {
            position: relative;
            border: 1px solid #30363d;
            border-radius: 8px;
            overflow: hidden;
            line-height: 0;
        }
        canvas {
            display: block;
            cursor: crosshair;
        }
        #controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            margin-top: 14px;
            padding: 12px 16px;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
        }
        #controls label {
            font-size: 0.85rem;
            color: #8b949e;
        }
        #controls select, #controls input[type="number"] {
            background: #0d1117;
            color: #e6edf3;
            border: 1px solid #30363d;
            border-radius: 5px;
            padding: 6px 8px;
            font-size: 0.85rem;
        }
        #controls button {
            background: #238636;
            color: #fff;
            border: none;
            border-radius: 5px;
            padding: 7px 14px;
            font-size: 0.85rem;
            cursor: pointer;
        }
        #controls button:hover {
            background: #2ea043;
        }
        #controls button.secondary {
            background: #21262d;
            border: 1px solid #30363d;
        }
        #controls button.secondary:hover {
            background: #30363d;
        }
        #info {
            margin-top: 10px;
            font-size: 0.8rem;
            color: #8b949e;
            text-align: center;
        }
        #info span {
            color: #e6edf3;
            font-family: monospace;
        }
        .hint {
            font-size: 0.75rem;
            color: #6e7681;
            margin-top: 6px;
        }
    </style>
</head>
<body>
    <h1>🌀 Fractale de Mandelbrot</h1>

    <div id="container">
        <canvas id="fractal" width="800" height="600"></canvas>
    </div>

    <div id="controls">
        <label for="palette">Palette</label>
        <select id="palette">
            <option value="classic">Classique (bleu)</option>
            <option value="fire">Feu</option>
            <option value="ocean">Océan</option>
            <option value="grayscale">Niveaux de gris</option>
            <option value="psychedelic">Psychédélique</option>
        </select>

        <label for="maxIter">Itérations max</label>
        <input type="number" id="maxIter" value="200" min="50" max="5000" step="50" style="width: 80px;">

        <button id="reset" class="secondary">↺ Réinitialiser</button>
        <button id="zoomIn">+ Zoom</button>
        <button id="zoomOut" class="secondary">− Dézoom</button>
    </div>

    <div id="info">
        Centre : <span id="infoCenter">-0.5, 0</span> &nbsp;|&nbsp;
        Échelle : <span id="infoScale">3.5</span> &nbsp;|&nbsp;
        Itérations : <span id="infoIter">200</span>
    </div>
    <div class="hint">Cliquez pour zoomer · Molette pour zoomer/dézoomer · Glissez pour déplacer</div>

    <script>
        const canvas = document.getElementById('fractal');
        const ctx = canvas.getContext('2d');
        const W = canvas.width;
        const H = canvas.height;

        const view = {
            centerX: -0.5,
            centerY: 0,
            scale: 3.5, // largeur du plan complexe affichée
        };

        const palettes = {
            classic: (t) => {
                // t entre 0 et 1
                const r = Math.round(9 * (1 - t) * t * t * t * 255);
                const g = Math.round(15 * (1 - t) * (1 - t) * t * t * 255);
                const b = Math.round(8.5 * (1 - t) * (1 - t) * (1 - t) * t * 255);
                return [r, g, b];
            },
            fire: (t) => [
                Math.round(Math.min(255, t * 3 * 255)),
                Math.round(Math.min(255, Math.max(0, (t - 0.33) * 3) * 255)),
                Math.round(Math.min(255, Math.max(0, (t - 0.66) * 3) * 255)),
            ],
            ocean: (t) => [
                Math.round(10 + 60 * t),
                Math.round(40 + 120 * t),
                Math.round(120 + 135 * t),
            ],
            grayscale: (t) => {
                const v = Math.round(t * 255);
                return [v, v, v];
            },
            psychedelic: (t) => [
                Math.round(127.5 + 127.5 * Math.sin(2 * Math.PI * (t + 0.0))),
                Math.round(127.5 + 127.5 * Math.sin(2 * Math.PI * (t + 0.33))),
                Math.round(127.5 + 127.5 * Math.sin(2 * Math.PI * (t + 0.67))),
            ],
        };

        function mandelbrotIter(cx, cy, maxIter) {
            let x = 0, y = 0;
            let i = 0;
            while (x * x + y * y <= 4 && i < maxIter) {
                const x2 = x * x - y * y + cx;
                y = 2 * x * y + cy;
                x = x2;
                i++;
            }
            return i;
        }

        function smoothIter(cx, cy, maxIter) {
            let x = 0, y = 0;
            let i = 0;
            while (x * x + y * y <= 256 && i < maxIter) {
                const x2 = x * x - y * y + cx;
                y = 2 * x * y + cy;
                x = x2;
                i++;
            }
            if (i >= maxIter) return maxIter;
            // lissage (smooth coloring)
            const logZn = Math.log(x * x + y * y) / 2;
            const nu = Math.log(logZn / Math.log(2)) / Math.log(2);
            return i + 1 - nu;
        }

        function render() {
            const maxIter = parseInt(document.getElementById('maxIter').value, 10) || 200;
            const paletteName = document.getElementById('palette').value;
            const colorize = palettes[paletteName] || palettes.classic;

            const img = ctx.createImageData(W, H);
            const data = img.data;

            const aspect = W / H;
            const scaleY = view.scale / aspect;

            for (let py = 0; py < H; py++) {
                const cy = view.centerY + (py - H / 2) * (scaleY / H);
                for (let px = 0; px < W; px++) {
                    const cx = view.centerX + (px - W / 2) * (view.scale / W);
                    const iter = smoothIter(cx, cy, maxIter);
                    const idx = (py * W + px) * 4;

                    if (iter >= maxIter) {
                        data[idx] = 0;
                        data[idx + 1] = 0;
                        data[idx + 2] = 0;
                    } else {
                        const t = iter / maxIter;
                        const [r, g, b] = colorize(t);
                        data[idx] = r;
                        data[idx + 1] = g;
                        data[idx + 2] = b;
                    }
                    data[idx + 3] = 255;
                }
            }

            ctx.putImageData(img, 0, 0);
            updateInfo(maxIter);
        }

        function updateInfo(maxIter) {
            document.getElementById('infoCenter').textContent =
                view.centerX.toPrecision(10) + ', ' + view.centerY.toPrecision(10);
            document.getElementById('infoScale').textContent = view.scale.toExponential(2);
            document.getElementById('infoIter').textContent = maxIter;
        }

        function pxToComplex(px, py) {
            const aspect = W / H;
            const scaleY = view.scale / aspect;
            return {
                x: view.centerX + (px - W / 2) * (view.scale / W),
                y: view.centerY + (py - H / 2) * (scaleY / H),
            };
        }

        function zoomAt(px, py, factor) {
            const before = pxToComplex(px, py);
            view.scale *= factor;
            const after = pxToComplex(px, py);
            view.centerX += before.x - after.x;
            view.centerY += before.y - after.y;
            render();
        }

        // Zoom au clic (facteur 2)
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const px = (e.clientX - rect.left) * (W / rect.width);
            const py = (e.clientY - rect.top) * (H / rect.height);
            zoomAt(px, py, 0.5);
        });

        // Zoom molette
        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const px = (e.clientX - rect.left) * (W / rect.width);
            const py = (e.clientY - rect.top) * (H / rect.height);
            zoomAt(px, py, e.deltaY > 0 ? 1.2 : 1 / 1.2);
        }, { passive: false });

        // Déplacement par glisser-déposer
        let dragging = false;
        let lastX = 0, lastY = 0;
        canvas.addEventListener('mousedown', (e) => {
            dragging = true;
            lastX = e.clientX;
            lastY = e.clientY;
        });
        window.addEventListener('mousemove', (e) => {
            if (!dragging) return;
            const rect = canvas.getBoundingClientRect();
            const dx = (e.clientX - lastX) * (view.scale / rect.width);
            const dy = (e.clientY - lastY) * ((view.scale / (W / H)) / rect.height);
            view.centerX -= dx;
            view.centerY += dy;
            lastX = e.clientX;
            lastY = e.clientY;
            render();
        });
        window.addEventListener('mouseup', () => { dragging = false; });

        // Contrôles
        document.getElementById('reset').addEventListener('click', () => {
            view.centerX = -0.5;
            view.centerY = 0;
            view.scale = 3.5;
            render();
        });
        document.getElementById('zoomIn').addEventListener('click', () => zoomAt(W / 2, H / 2, 0.5));
        document.getElementById('zoomOut').addEventListener('click', () => zoomAt(W / 2, H / 2, 2));
        document.getElementById('palette').addEventListener('change', render);
        document.getElementById('maxIter').addEventListener('change', render);

        // Zoom sur mobile (pinch)
        let pinchDist = null;
        canvas.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) {
                pinchDist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
            }
        }, { passive: true });
        canvas.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2 && pinchDist) {
                e.preventDefault();
                const dist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                const rect = canvas.getBoundingClientRect();
                const midX = ((e.touches[0].clientX + e.touches[1].clientX) / 2 - rect.left) * (W / rect.width);
                const midY = ((e.touches[0].clientY + e.touches[1].clientY) / 2 - rect.top) * (H / rect.height);
                zoomAt(midX, midY, pinchDist / dist);
                pinchDist = dist;
            }
        }, { passive: false });

        render();
    </script>
</body>
</html>
