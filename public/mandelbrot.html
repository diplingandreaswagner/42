<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Everything App - Mandelbrot</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #1a1a2e;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        h1 { margin: 16px 0 8px; font-weight: normal; }
        #toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-bottom: 12px;
            padding: 0 16px;
        }
        #toolbar button, #toolbar label {
            padding: 8px 14px;
            border: 1px solid #4a4a6a;
            border-radius: 4px;
            background-color: #252540;
            color: #e0e0e0;
            cursor: pointer;
            font-size: 14px;
        }
        #toolbar button:hover { background-color: #35355a; }
        #toolbar label { cursor: default; display: flex; align-items: center; gap: 6px; }
        #toolbar input[type="range"] { cursor: pointer; }
        #stage { position: relative; }
        canvas {
            display: block;
            background-color: #000;
            border: 1px solid #4a4a6a;
            border-radius: 4px;
            cursor: crosshair;
        }
        #hud {
            margin-top: 10px;
            font-size: 13px;
            font-family: monospace;
            color: #9a9ab8;
            padding-bottom: 16px;
            text-align: center;
        }
        #loading {
            position: absolute;
            top: 8px;
            right: 8px;
            padding: 4px 10px;
            background-color: rgba(0,0,0,0.7);
            border-radius: 4px;
            font-size: 12px;
            display: none;
        }
        .hint { font-size: 12px; color: #7a7a9a; margin-top: 4px; }
    </style>
</head>
<body>
    <h1>Mandelbrot Explorer</h1>
    <div id="toolbar">
        <button id="zoomIn">Zoom In</button>
        <button id="zoomOut">Zoom Out</button>
        <button id="reset">Reset</button>
        <button id="save">Save PNG</button>
        <label>Iterations: <span id="iterLabel">500</span>
            <input type="range" id="iterations" min="50" max="5000" step="50" value="500">
        </label>
    </div>
    <div id="stage">
        <canvas id="canvas" width="800" height="600"></canvas>
        <div id="loading">Rendering…</div>
    </div>
    <div id="hud">
        <div id="coords">Center: (0, 0) &nbsp;|&nbsp; Zoom: 1x</div>
        <div class="hint">Click to zoom in &middot; Shift+click to zoom out &middot; Drag to pan &middot; Scroll to zoom</div>
    </div>
    <script>
        (function () {
            'use strict';

            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            const loadingEl = document.getElementById('loading');
            const coordsEl = document.getElementById('coords');
            const iterInput = document.getElementById('iterations');
            const iterLabel = document.getElementById('iterLabel');

            const DEFAULT_VIEW = { cx: -0.6, cy: 0, scale: 3.5 };
            let view = { cx: DEFAULT_VIEW.cx, cy: DEFAULT_VIEW.cy, scale: DEFAULT_VIEW.scale };
            let maxIter = 500;
            let renderId = 0;
            let dragging = false;
            let dragStart = null;
            let dragMoved = false;

            function resize() {
                const maxW = Math.min(900, window.innerWidth - 32);
                const maxH = Math.max(400, window.innerHeight - 280);
                const w = Math.max(320, maxW);
                const h = Math.max(320, maxH);
                canvas.width = w;
                canvas.height = h;
                render();
            }

            function pixelToComplex(px, py) {
                const aspect = canvas.width / canvas.height;
                const halfH = view.scale / 2;
                const halfW = halfH * aspect;
                return {
                    x: view.cx - halfW + (px / canvas.width) * 2 * halfW,
                    y: view.cy - halfH + (py / canvas.height) * 2 * halfH
                };
            }

            function complexToPixel(cx, cy) {
                const aspect = canvas.width / canvas.height;
                const halfH = view.scale / 2;
                const halfW = halfH * aspect;
                return {
                    px: ((cx - (view.cx - halfW)) / (2 * halfW)) * canvas.width,
                    py: ((cy - (view.cy - halfH)) / (2 * halfH)) * canvas.height
                };
            }

            function palette(n, maxIter) {
                if (n === maxIter) return [0, 0, 0];
                const t = n / maxIter;
                const r = Math.floor(9 * (1 - t) * t * t * t * 255);
                const g = Math.floor(15 * (1 - t) * (1 - t) * t * t * 255);
                const b = Math.floor(8.5 * (1 - t) * (1 - t) * (1 - t) * t * 255);
                return [r, g, b];
            }

            function render() {
                const id = ++renderId;
                loadingEl.style.display = 'block';

                const img = ctx.createImageData(canvas.width, canvas.height);
                const data = img.data;
                const aspect = canvas.width / canvas.height;
                const halfH = view.scale / 2;
                const halfW = halfH * aspect;
                const x0 = view.cx - halfW;
                const y0 = view.cy - halfH;
                const dx = (2 * halfW) / canvas.width;
                const dy = (2 * halfH) / canvas.height;
                const n = maxIter;
                const rowBuf = canvas.width * 4;
                let row = 0;

                function renderRows() {
                    if (id !== renderId) return;
                    const deadline = performance.now() + 30;
                    while (row < canvas.height && performance.now() < deadline) {
                        const cyImag = y0 + row * dy;
                        for (let col = 0; col < canvas.width; col++) {
                            const cxReal = x0 + col * dx;
                            let zx = 0, zy = 0, i = 0;
                            let zx2 = 0, zy2 = 0;
                            while (i < n && zx2 + zy2 <= 4) {
                                zy = 2 * zx * zy + cyImag;
                                zx = zx2 - zy2 + cxReal;
                                zx2 = zx * zx;
                                zy2 = zy * zy;
                                i++;
                            }
                            const offset = row * rowBuf + col * 4;
                            const c = palette(i, n);
                            data[offset] = c[0];
                            data[offset + 1] = c[1];
                            data[offset + 2] = c[2];
                            data[offset + 3] = 255;
                        }
                        row++;
                    }
                    ctx.putImageData(img, 0, 0);
                    if (row < canvas.height) {
                        requestAnimationFrame(renderRows);
                    } else {
                        loadingEl.style.display = 'none';
                    }
                }
                requestAnimationFrame(renderRows);

                const zoomFactor = DEFAULT_VIEW.scale / view.scale;
                const digits = zoomFactor >= 1e10 ? zoomFactor.toExponential(2) : zoomFactor.toFixed(2);
                coordsEl.textContent =
                    'Center: (' + view.cx.toFixed(10) + ', ' + view.cy.toFixed(10) +
                    ')  |  Zoom: ' + digits + 'x  |  Iterations: ' + maxIter;
            }

            function zoomSimple(px, py, factor) {
                const target = pixelToComplex(px, py);
                view.scale /= factor;
                view.cx = target.x + (view.cx - target.x) / factor;
                view.cy = target.y + (view.cy - target.y) / factor;
                render();
            }

            canvas.addEventListener('click', function (e) {
                if (dragMoved) return;
                const pos = eventPos(e);
                const factor = e.shiftKey ? 0.5 : 2;
                zoomSimple(pos.x, pos.y, factor);
            });

            canvas.addEventListener('wheel', function (e) {
                e.preventDefault();
                const pos = eventPos(e);
                const factor = e.deltaY < 0 ? 1.2 : 1 / 1.2;
                zoomSimple(pos.x, pos.y, factor);
            }, { passive: false });

            canvas.addEventListener('mousedown', function (e) {
                dragging = true;
                dragMoved = false;
                dragStart = { pos: eventPos(e), cx: view.cx, cy: view.cy };
            });

            window.addEventListener('mousemove', function (e) {
                if (!dragging) return;
                const pos = eventPos(e);
                const dPixelsX = pos.x - dragStart.pos.x;
                const dPixelsY = pos.y - dragStart.pos.y;
                if (Math.abs(dPixelsX) + Math.abs(dPixelsY) > 3) dragMoved = true;
                const complexPerPxX = (view.scale * (canvas.width / canvas.height)) / canvas.width;
                const complexPerPxY = view.scale / canvas.height;
                view.cx = dragStart.cx - dPixelsX * complexPerPxX;
                view.cy = dragStart.cy - dPixelsY * complexPerPxY;
                render();
            });

            window.addEventListener('mouseup', function () { dragging = false; });

            canvas.addEventListener('touchstart', function (e) {
                if (e.touches.length === 1) {
                    dragging = true;
                    dragMoved = false;
                    dragStart = { pos: eventPos(e.touches[0]), cx: view.cx, cy: view.cy };
                }
            }, { passive: true });

            canvas.addEventListener('touchmove', function (e) {
                if (dragging && e.touches.length === 1) {
                    e.preventDefault();
                    const pos = eventPos(e.touches[0]);
                    const dPixelsX = pos.x - dragStart.pos.x;
                    const dPixelsY = pos.y - dragStart.pos.y;
                    if (Math.abs(dPixelsX) + Math.abs(dPixelsY) > 3) dragMoved = true;
                    const complexPerPxX = (view.scale * (canvas.width / canvas.height)) / canvas.width;
                    const complexPerPxY = view.scale / canvas.height;
                    view.cx = dragStart.cx - dPixelsX * complexPerPxX;
                    view.cy = dragStart.cy - dPixelsY * complexPerPxY;
                    render();
                }
            }, { passive: false });

            canvas.addEventListener('touchend', function (e) {
                dragging = false;
                if (dragMoved) return;
                if (e.changedTouches.length === 1) {
                    const pos = eventPos(e.changedTouches[0]);
                    zoomSimple(pos.x, pos.y, 2);
                }
            });

            function eventPos(e) {
                const rect = canvas.getBoundingClientRect();
                return {
                    x: (e.clientX - rect.left) * (canvas.width / rect.width),
                    y: (e.clientY - rect.top) * (canvas.height / rect.height)
                };
            }

            document.getElementById('zoomIn').addEventListener('click', function () {
                zoomSimple(canvas.width / 2, canvas.height / 2, 2);
            });

            document.getElementById('zoomOut').addEventListener('click', function () {
                zoomSimple(canvas.width / 2, canvas.height / 2, 0.5);
            });

            document.getElementById('reset').addEventListener('click', function () {
                view = { cx: DEFAULT_VIEW.cx, cy: DEFAULT_VIEW.cy, scale: DEFAULT_VIEW.scale };
                maxIter = 500;
                iterInput.value = 500;
                iterLabel.textContent = '500';
                render();
            });

            document.getElementById('save').addEventListener('click', function () {
                const link = document.createElement('a');
                link.download = 'mandelbrot.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            });

            iterInput.addEventListener('input', function () {
                maxIter = parseInt(iterInput.value, 10);
                iterLabel.textContent = iterInput.value;
                render();
            });

            window.addEventListener('resize', resize);

            resize();
        })();
    </script>
</body>
</html>
